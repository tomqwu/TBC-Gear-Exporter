name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build + publish GitHub + CurseForge
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and tag
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            prerelease="false"
          else
            prerelease="true"
          fi
          {
            echo "tag=$tag"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved tag=$tag prerelease=$prerelease"

      - name: Validate tag and addon versions
        run: |
          set -euo pipefail
          tag_version="${{ steps.version.outputs.tag }}"
          tag_version="${tag_version#v}"
          toc_version="$(awk -F ': ' '/^## Version:/ { print $2; exit }' TBCGearExporter/TBCGearExporter.toc)"
          if [[ -z "$toc_version" || "$toc_version" != "$tag_version" ]]; then
            echo "::error::Tag version $tag_version does not match addon version ${toc_version:-missing}."
            exit 1
          fi

      - name: Require CurseForge token for stable releases
        if: steps.version.outputs.prerelease == 'false'
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${CF_API_KEY:-}" ]]; then
            echo "::error::Set the CF_API_KEY repository secret before publishing a stable release."
            exit 1
          fi

      - name: Extract release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          version_no_v="${{ steps.version.outputs.tag }}"
          version_no_v="${version_no_v#v}"
          awk -v ver="$version_no_v" '
            $0 ~ "^## \\[" ver "\\]" { flag = 1; next }
            flag && /^## \[/         { flag = 0 }
            flag                     { print }
          ' CHANGELOG.md > /tmp/notes.md
          if [[ ! -s /tmp/notes.md ]]; then
            printf '_No notes found in CHANGELOG.md. Commit summary:_\n\n%s\n' \
              "$(git log -1 --pretty=format:'%s%n%n%b')" > /tmp/notes.md
          fi
          {
            echo ""
            echo "### How to test"
            echo ""
            echo "1. Download \`TBCGearExporter-${{ steps.version.outputs.tag }}.zip\` below."
            echo "2. Extract so \`TBCGearExporter.toc\` lives at \`<WoW>/_anniversary_/Interface/AddOns/TBCGearExporter/TBCGearExporter.toc\`."
            echo "3. Restart WoW or run \`/reload\`."
            echo "4. Use \`/tbcgear gui\` to open the AI-ready export window."
          } >> /tmp/notes.md
          cat /tmp/notes.md

      - name: Build addon zip
        id: zip
        run: |
          set -euo pipefail
          mkdir -p .release
          out=".release/TBCGearExporter-${{ steps.version.outputs.tag }}.zip"
          zip -r "$out" TBCGearExporter \
            -x 'TBCGearExporter/Tests/*' \
            -x 'TBCGearExporter/.*' \
            -x '*.luacov.*'
          echo "path=$out" >> "$GITHUB_OUTPUT"
          unzip -l "$out"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: TBCGearExporter ${{ steps.version.outputs.tag }}
          body_path: /tmp/notes.md
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          files: ${{ steps.zip.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish stable release to CurseForge
        if: steps.version.outputs.prerelease == 'false'
        uses: BigWigsMods/packager@master
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        with:
          args: -e -l -r ${{ github.workspace }}/.release/curseforge

      - name: Upload CurseForge package artifact
        if: steps.version.outputs.prerelease == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: TBCGearExporter-CurseForge-${{ steps.version.outputs.tag }}
          path: .release/curseforge/*.zip
          if-no-files-found: error
